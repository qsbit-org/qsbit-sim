exclude: ^third_party/
default_install_hook_types: [pre-commit, commit-msg]
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: check-merge-conflict
      - id: check-yaml
      - id: check-json
      - id: check-toml
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: 5c3f3c61b143a94e9ab5d767ff4d0dc9d6801aa3 # v4.3.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args: [--strict, --verbose]
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: f12be1ebaa5351c1fc76472de98db2c3446c8253 # v0.16.10
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
  - repo: local
    hooks:
      - id: clang-format-check
        name: Check C++ formatting
        entry: .venv/bin/clang-format --dry-run --Werror
        language: system
        files: ^(contracts/include|include|src|tests)/.*\.(cpp|hpp)$
