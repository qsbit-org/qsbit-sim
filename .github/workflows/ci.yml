name: Build and verify
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: core-sanitizers
            preset: clang-ninja
            compiler: clang
            build_dir: build-clang
            build_type: Debug
            python: '3.12'
            bridge: 'OFF'
            aer: 'OFF'
            pulse: 'OFF'
            extras: ''
            sanitizers: 'ON'
          - name: bridge-only
            preset: gcc-ninja
            compiler: gcc
            build_dir: build-gcc
            build_type: Debug
            python: '3.10'
            bridge: 'ON'
            aer: 'OFF'
            pulse: 'OFF'
            extras: ''
            sanitizers: 'OFF'
          - name: aer
            preset: clang-ninja
            compiler: clang
            build_dir: build-clang
            build_type: Debug
            python: '3.12'
            bridge: 'ON'
            aer: 'ON'
            pulse: 'OFF'
            extras: '--extra aer'
            sanitizers: 'OFF'
          - name: pulse
            preset: gcc-ninja-release
            compiler: gcc
            build_dir: build-gcc-release
            build_type: Release
            python: '3.13'
            bridge: 'ON'
            aer: 'ON'
            pulse: 'ON'
            extras: '--extra pulse'
            sanitizers: 'OFF'
    name: ${{ matrix.name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install build and test tools
        run: |
          sudo apt-get update && sudo apt-get install -y binutils-riscv64-unknown-elf clang ninja-build
          python -m pip install uv==0.12.7
          uv sync --frozen --group build --python "$(command -v python)" --extra dev --extra verification ${{ matrix.extras }}
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
          echo "VIRTUAL_ENV=$PWD/.venv" >> "$GITHUB_ENV"
      - name: Provision architecture tests
        run: |
          git init build/riscv-arch-test
          git -C build/riscv-arch-test fetch --depth 1 https://github.com/riscv/riscv-arch-test.git 37e6e0022814d880375e4a310b4a9a10fb9b268a
          git -C build/riscv-arch-test checkout --detach FETCH_HEAD
      - name: Prepare Conan dependencies
        run: |
          conan config install conan/config
          conan install . -pr:a=conan/profiles/${{ matrix.compiler }} \
            -s build_type=${{ matrix.build_type }} --build=missing -c tools.build:jobs=2
      - name: Check pre-commit hooks
        if: matrix.name == 'core-sanitizers'
        run: pre-commit run --all-files
      - name: Check optional dependency isolation
        if: matrix.extras == ''
        run: |
          python -c "import importlib.util; import qsbit_backend; assert all(importlib.util.find_spec(x) is None for x in ('qiskit', 'qiskit_aer', 'numpy', 'scipy'))"
      - name: Configure
        run: |
          cmake --preset ${{ matrix.preset }} \
            -DBUILD_TESTING=ON \
            -DQSBIT_SANITIZERS=${{ matrix.sanitizers }} \
            -DQSBIT_PYTHON_BACKENDS=${{ matrix.bridge }} \
            -DQSBIT_TEST_AER=${{ matrix.aer }} \
            -DQSBIT_TEST_PULSE=${{ matrix.pulse }} \
            -DQSBIT_ISA_REFERENCES=ON \
            -DQSBIT_ARCH_TEST_SOURCE="$PWD/build/riscv-arch-test"
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }} --parallel 2
      - name: Run scripted example
        env:
          ASAN_OPTIONS: detect_leaks=0:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          ./${{ matrix.build_dir }}/qsbit-sim --config ${{ matrix.build_dir }}/examples/runs/scripted.json
          python -c "import json; from pathlib import Path; result = json.loads(Path('${{ matrix.build_dir }}/runs/scripted.json').read_text()); assert result['success'] and result['memory']['4096'] == 1"
      - name: Test
        env:
          ASAN_OPTIONS: detect_leaks=0:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: ctest --preset ${{ matrix.preset }}
      - name: Preserve diagnostic artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: traces-${{ matrix.name }}
          path: |
            ${{ matrix.build_dir }}/Testing/Temporary/
            ${{ matrix.build_dir }}/*.jsonl
            ${{ matrix.build_dir }}/runs/
            ${{ matrix.build_dir }}/use-cases/
            ${{ matrix.build_dir }}/plugin-test/
            ${{ matrix.build_dir }}/random-isa/report.json
            ${{ matrix.build_dir }}/architecture-isa/report.json

  macos:
    name: macOS core
    runs-on: macos-14
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install build and test tools
        run: brew install cmake ninja git python uv riscv64-elf-binutils
      - name: Prepare Conan dependencies
        run: |
          uv sync --frozen --group build --inexact
          uv run --frozen --group build --inexact conan config install conan/config
          uv run --frozen --group build --inexact conan install . -pr:a=conan/profiles/clang --build=missing
      - name: Build with README commands
        run: |
          cmake --preset clang-ninja
          cmake --build --preset clang-ninja --parallel 3
      - name: Run scripted example
        run: |
          build-clang/qsbit-sim --config build-clang/examples/runs/scripted.json
          python3 -c "import json; from pathlib import Path; result = json.loads(Path('build-clang/runs/scripted.json').read_text()); assert result['success'] and result['memory']['4096'] == 1"
      - name: Build and run core tests
        run: |
          cmake --preset clang-ninja -DBUILD_TESTING=ON
          cmake --build --preset clang-ninja --parallel 3
          ctest --preset clang-ninja
      - name: Preserve diagnostic artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: traces-macos-core
          path: |
            build-clang/Testing/Temporary/
            build-clang/runs/
            build-clang/use-cases/

  documentation:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install documentation and example tools
        run: |
          sudo apt-get update
          sudo apt-get install -y doxygen graphviz ninja-build binutils-riscv64-unknown-elf
          python -m pip install uv==0.12.7
          uv sync --frozen --group build --extra docs --extra docs-test
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
          echo "VIRTUAL_ENV=$PWD/.venv" >> "$GITHUB_ENV"
          .venv/bin/python -m playwright install --with-deps chromium
      - name: Prepare Conan dependencies
        run: |
          conan config install conan/config
          conan install . -pr:a=conan/profiles/gcc --build=missing -c tools.build:jobs=2
      - name: Build simulator and examples
        run: |
          cmake --preset gcc-ninja \
            -DBUILD_TESTING=ON -DQSBIT_TEST_WEBSITE=ON
          cmake --build --preset gcc-ninja --parallel 2
      - name: Verify documentation and browser behavior
        run: ctest --test-dir build-gcc -L 'fast|website' --output-on-failure
      - name: Preserve local website and browser captures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: documentation-site
          path: |
            build-gcc/docs/html/
            build-gcc/docs/*.png
            build-gcc/Testing/Temporary/
      - name: Upload Pages website
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: build-gcc/docs/html

  deploy-pages:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [native, macos, documentation]
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy documentation
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
