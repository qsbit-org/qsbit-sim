name: Build and verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: core-sanitizers
            build_type: Debug
            python: '3.12'
            bridge: 'OFF'
            aer: 'OFF'
            pulse: 'OFF'
            extras: ''
            sanitizers: 'ON'
          - name: bridge-only
            build_type: Debug
            python: '3.10'
            bridge: 'ON'
            aer: 'OFF'
            pulse: 'OFF'
            extras: ''
            sanitizers: 'OFF'
          - name: aer
            build_type: Debug
            python: '3.12'
            bridge: 'ON'
            aer: 'ON'
            pulse: 'OFF'
            extras: '--extra aer'
            sanitizers: 'OFF'
          - name: pulse
            build_type: Release
            python: '3.13'
            bridge: 'ON'
            aer: 'ON'
            pulse: 'ON'
            extras: '--extra pulse'
            sanitizers: 'OFF'
    name: ${{ matrix.name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install build and test tools
        run: |
          sudo apt-get update && sudo apt-get install -y binutils-riscv64-unknown-elf
          python -m pip install uv==0.12.7
          uv sync --frozen --python "$(command -v python)" --extra dev --extra verification ${{ matrix.extras }}
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
          echo "VIRTUAL_ENV=$PWD/.venv" >> "$GITHUB_ENV"
      - name: Provision architecture tests
        run: |
          git init build/riscv-arch-test
          git -C build/riscv-arch-test fetch --depth 1 https://github.com/riscv/riscv-arch-test.git 37e6e0022814d880375e4a310b4a9a10fb9b268a
          git -C build/riscv-arch-test checkout --detach FETCH_HEAD
      - name: Check formatting
        run: python tools/check_format.py --formatter .venv/bin/clang-format
      - name: Check optional dependency isolation
        if: matrix.extras == ''
        run: |
          python -c "import importlib.util; import qsbit_backend; assert all(importlib.util.find_spec(x) is None for x in ('qiskit', 'qiskit_aer', 'numpy', 'scipy'))"
      - name: Configure
        run: |
          cmake -S . -B build \
            -DBUILD_TESTING=ON \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DQSBIT_SANITIZERS=${{ matrix.sanitizers }} \
            -DQSBIT_PYTHON_BACKENDS=${{ matrix.bridge }} \
            -DQSBIT_TEST_AER=${{ matrix.aer }} \
            -DQSBIT_TEST_PULSE=${{ matrix.pulse }} \
            -DQSBIT_ISA_REFERENCES=ON \
            -DQSBIT_ARCH_TEST_SOURCE="$PWD/build/riscv-arch-test"
      - name: Build
        run: cmake --build build --parallel 2
      - name: Test
        env:
          ASAN_OPTIONS: detect_leaks=0:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: ctest --test-dir build --output-on-failure
      - name: Preserve diagnostic artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: traces-${{ matrix.name }}
          path: |
            build/Testing/Temporary/
            build/*.jsonl
            build/use-cases/
            build/plugin-test/
            build/config-examples/
            build/random-isa/report.json
            build/architecture-isa/report.json
