name: Check links

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '23 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: links-${{ github.ref }}
  cancel-in-progress: true

jobs:
  links:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Check external links and images
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          lycheeVersion: v0.24.2
          args: >-
            --no-progress --scheme https --scheme http --exclude-loopback
            --timeout 30 --max-retries 2 --max-concurrency 4
            './*.md' 'docs/**/*.md' 'examples/**/*.md'
          fail: true
          failIfEmpty: true
          output: ${{ runner.temp }}/link-report.md
