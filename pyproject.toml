[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qsbit-sim-backends"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["pybind11>=3.0,<4"]

[project.optional-dependencies]
aer = ["qiskit>=2.1,<3", "qiskit-aer>=0.17,<0.18", "numpy>=1.26,<3"]
pulse = ["qsbit-sim-backends[aer]", "scipy>=1.11,<2"]
verification = ["unicorn==2.1.4", "pyelftools==0.32"]
dev = ["clang-format==18.1.8"]
docs = ["sphinx>=8.1,<9", "myst-parser>=4,<5", "breathe>=4.36,<5", "furo>=2024.8,<2026"]
docs-test = ["playwright>=1.51,<2"]

[tool.setuptools.packages.find]
where = ["python"]
